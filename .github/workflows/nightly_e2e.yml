name: Nightly E2E

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC every day
  workflow_dispatch:

jobs:
  voice-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: System audio + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sox tesseract-ocr xdotool wl-clipboard \
            ffmpeg libsndfile1
      - name: Sync deps
        run: uv sync --frozen
      - name: Run e2e tests (test_e2e_*)
        env:
          NOVA_E2E: "1"
          NOVA_HEADLESS: "1"
        run: uv run pytest -q tests/test_e2e_*.py
      - name: Run GAIA-lite
        run: |
          uv run python -m nova.quality.gaia_lite \
            --release-tag "nightly-$(date +%Y%m%d)" \
            --output ./benchmarks || true
      - name: Run tau2-bench voice
        run: |
          uv run python -m nova.quality.tau2_voice \
            --suite tests/fixtures/voice/*.wav || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: |
            benchmarks/
            ./*.log
