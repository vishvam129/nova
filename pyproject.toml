[project]
name = "nova"
version = "0.1.0"
description = "Nova: cross-device AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nova contributors" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "numpy>=1.26",
    "sounddevice>=0.4",
]

[project.scripts]
nova = "nova.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/nova"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "openwakeword.*",
    "pvporcupine",
    "numpy",
    "sounddevice",
    "whisper",
    "faster_whisper",
    "moonshine",
    "nemo.*",
    "silero_vad",
    "torch",
    "piper",
    "kokoro",
    "styletts2",
    "TTS.*",
    "elevenlabs.*",
    "webrtc_audio_processing",
    "ollama",
    "llama_cpp",
    "openai",
    "anthropic",
    "google",
    "google.*",
    "psutil",
    "mcp",
    "mcp.*",
    "playwright.*",
    "pyautogui",
    "mss",
    "PIL",
    "PIL.*",
    "chromadb",
    "y_py",
    "fastapi",
    "fastapi.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
